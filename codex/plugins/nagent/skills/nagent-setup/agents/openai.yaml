interface:
  display_name: "Set up Nagent"
  short_description: "Connect Nagent and wire its API into this project"
  default_prompt: "Set up Nagent in this project."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "nagent"
      description: "Nagent MCP server (OAuth sign-in)"
      transport: "streamable_http"
      url: "https://nagent.ai/api/mcp/nagent"
